services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8090"
    volumes:
      - ${DOCKER_DATA_PATH}/data:/beszel_data
      - ${DOCKER_DATA_PATH}/socket:/beszel_socket
    environment:
      - BESZEL_HUB_USER_CREATION=${BESZEL_HUB_USER_CREATION:-false}
      - BESZEL_HUB_SHARE_ALL_SYSTEMS=${BESZEL_HUB_SHARE_ALL_SYSTEMS:-false}
