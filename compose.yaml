services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "${POST:-8090}:8090"
    volumes:
      - ${DOCKER_DATA_PATH}/data:/beszel_data
      - ${DOCKER_DATA_PATH}/socket:/beszel_socket
    environment:
      - BESZEL_HUB_USER_CREATION=${BESZEL_HUB_USER_CREATION:-false}
      - BESZEL_HUB_SHARE_ALL_SYSTEMS=${BESZEL_HUB_SHARE_ALL_SYSTEMS:-false}

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${DOCKER_DATA_PATH}/agent_data:/var/lib/beszel-agent
      - ${DOCKER_DATA_PATH}/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LISTEN=${LISTEN:-/beszel_socket/beszel.sock}
      - HUB_URL=${HUB_URL:-http://localhost:8095}
      - TOKEN=${TOKEN:-}
      - KEY=${KEY:-}
